apiVersion: apps/v1
kind: Deployment
metadata:
  name: reap
  labels:
    app: reap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reap
  template:
    metadata:
      labels:
        app: reap
    spec:
      containers:
      - name: reap
        image: ghcr.io/gabeduke/reap:latest  # CI also tags sha-<short>; pin to that when rolling out
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
        env:
        - name: DB
          value: "http://influxdb-influxdb2.influxdb"
        - name: BROKER
          value: "tcp://mqtt.leetserve.com:1883"
        - name: BUCKET
          value: "home"
        - name: ORG
          value: "leetserve"
        - valueFrom:
            secretKeyRef:
              name: reap-creds
              key: INFLUXDB_TOKEN
          name: INFLUXDB_TOKEN
